```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش دانش‌آموز | مدرسه‌یار</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="edit-page">
        <section class="panel">
            <div class="panel-heading">
                <div>
                    <h1>ویرایش اطلاعات دانش‌آموز</h1>
                    <p>اطلاعات جدید را وارد کن.</p>
                </div>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="student-form">

                <div class="form-group">
                    <label for="full_name">نام و نام خانوادگی *</label>
                    <input id="full_name" name="full_name"
                           value="{{ student['full_name'] }}" required maxlength="100">
                </div>

                <div class="form-group">
                    <label for="student_code">کد دانش‌آموزی *</label>
                    <input id="student_code" name="student_code"
                           value="{{ student['student_code'] }}" required maxlength="30">
                </div>

                <div class="form-group">
                    <label for="grade">پایه تحصیلی *</label>
                    <select id="grade" name="grade" required>
                        {% for grade in ["هفتم", "هشتم", "نهم", "دهم", "یازدهم", "دوازدهم"] %}
                            <option value="{{ grade }}"
                                {% if student['grade'] == grade %}selected{% endif %}>
                                {{ grade }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="classroom">کلاس *</label>
                    <input id="classroom" name="classroom"
                           value="{{ student['classroom'] }}" required maxlength="30">
                </div>

                <div class="form-group">
                    <label for="phone">شماره تماس</label>
                    <input id="phone" name="phone" type="tel"
                           value="{{ student['phone'] }}" maxlength="30">
                </div>

                <div class="form-actions">
                    <button class="button primary" type="submit">ذخیره تغییرات</button>
                    <a class="button secondary" href="{{ url_for('students') }}">انصراف</a>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
```
